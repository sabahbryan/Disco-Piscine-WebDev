<style>
body, html {
        height: 100vh;
        margin: auto;
	justify-content: center;
}
.parallax {
        height: 100vh;
        background-attachment: fixed;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
}
.block {
        background-color: black;
        height: 500px;
        display: flex;
        justify-content: center;
        align-items: center;
}
.profile-container {
	display: flex;
	justify-content: center;
}
.profile-card {
	justify-content: center;
	text-align: center;
}
.img1 {
        background-image: url('https://preview.redd.it/los-santos-wallpaper-v0-g9kwygybv3751.jpg?width=1080&crop=smart&auto=webp&s=5c6447deb074329078d9f4f121447bf27752e232')
}
.img2 {
        background-image: url('https://wallpapers-clan.com/wp-content/uploads/2025/07/vice-city-retro-evening-skyline-desktop-wallpaper-preview.jpg')
}
.navbar {
	overflow: hidden;
	background-color: rgba(13, 13, 13, 0.95) !important;
	justify-content: center;
	align-items: center;
	border-collapse: collapse;
}
.navbar a {
	float: center;
	font-size: 16px;
	text-align: center;
	padding: 14px 16px;
	text-decoration: none;
}
.button {
	background-color: transparent;
	height: 10px;
	width: 20px;
	padding: 2px;
	text-decoration: none;
	display: inline-block;
	margin: 0 10px;
	text-align: center;
}
</style>
