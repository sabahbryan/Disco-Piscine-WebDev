<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Responsive</title>

        <style>
            table {
                margin-left: auto;
                margin-right: auto;
                width: 100%;
                height: 100vh;
                table-layout: fixed;
            }

            td {
                border: 2px solid black;
                margin: 0;
                padding: auto;
                text-align: left;
            }

            td.first {
                background-color: aquamarine;
            }

            td.second{
                background-color: aqua;
            }
        </style>

    </head>

    <body>

        <table>
            <tr>
                <td class="first">First</td>
                <td class="second">Second</td>
            </tr>
        </table>

    </body>
</html>
